[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pead-inspector"
version = "0.2.0"
description = "Local EfficientAD and PatchCore visual inspection workstation"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "numpy>=2.2,<3", "opencv-python-headless>=4.12,<5", "pillow>=11,<13"]

[project.optional-dependencies]
ml = ["anomalib==2.7.0", "torch==2.10.0", "torchvision==0.25.0", "lightning>=2.6,!=2.6.2,!=2.6.3,<2.7", "pytorch-lightning>=2.6,!=2.6.2,!=2.6.3,<2.7", "timm>=1.0,<1.1", "requests>=2.31,<3"]
dev = ["pytest>=8", "httpx>=0.27"]

# OpenVINO/CLIP/video backends are optional and are not needed for these models.

[tool.setuptools.packages.find]
include = ["pead*"]

[tool.setuptools.package-data]
pead = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
