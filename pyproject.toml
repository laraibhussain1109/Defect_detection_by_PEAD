[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pead-inspector"
version = "0.1.0"
description = "Local EfficientAD and PatchCore visual inspection workstation"
requires-python = ">=3.10,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "numpy>=1.26,<2", "opencv-python-headless>=4.10,<4.12", "pillow>=10,<12"]

[project.optional-dependencies]
ml = ["anomalib==2.0.0", "torch==2.5.1", "torchvision==0.20.1", "lightning>=2.2,<2.6", "pytorch-lightning>=2.2,<2.6", "timm>=1.0,<1.1", "einops>=0.7", "kornia>=0.7,<0.9", "scikit-learn>=1.4,<1.7", "matplotlib>=3.8,<4", "pandas>=2.1,<3", "open-clip-torch>=2.24,<2.26.1", "python-dotenv>=1", "FrEIA>=0.2", "omegaconf>=2.3", "av>=12", "tifffile>=2024.1,<2025", "scikit-image>=0.23,<0.26", "openvino==2024.6.0", "requests>=2.31,<3"]
dev = ["pytest>=8", "httpx>=0.27"]

# anomalib 2.0 imports the OpenVINO inferencer unconditionally.

[tool.setuptools.packages.find]
include = ["pead*"]

[tool.setuptools.package-data]
pead = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
